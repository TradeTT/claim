<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Claim Your Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ── Grey theme. Change the colours here. ─────────────────── */
  :root {
    --page-top: #E9EAEC;
    --page-bottom: #DADCE0;
    --card: #F8F8F9;
    --field: #FFFFFF;
    --line: #D3D5DA;
    --line-strong: #B9BCC3;
    --ink: #212328;
    --ink-2: #5B5F67;        /* secondary text */
    --ink-3: #868A92;        /* placeholders only */
    --btn: #26282D;
    --btn-hover: #3B3E45;
    --btn-ink: #FFFFFF;
    --ok: #2E7D5B;           /* success + the green candle */
    --bad: #B4483F;
    --warn: #8F6212;
    --info: #3F5A78;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(20,22,26,.06), 0 12px 32px -12px rgba(20,22,26,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page-top: #1B1C1F;
      --page-bottom: #121315;
      --card: #212328;
      --field: #1A1B1E;
      --line: #34373D;
      --line-strong: #4A4E56;
      --ink: #EDEEF0;
      --ink-2: #A5A9B1;
      --ink-3: #777B83;
      --btn: #EDEEF0;
      --btn-hover: #FFFFFF;
      --btn-ink: #17181B;
      --ok: #5CBF93;
      --bad: #E88D85;
      --warn: #E2B45A;
      --info: #8FB0D6;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px -12px rgba(0,0,0,.6);
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh; min-height: 100dvh;
    background: linear-gradient(180deg, var(--page-top), var(--page-bottom)) fixed;
    color: var(--ink);
    font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size: 15px; line-height: 1.55;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
  }
  .card {
    width: 100%; max-width: 440px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 36px 32px 28px;
    box-shadow: var(--shadow);
  }

  /* brand */
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .brand img { height: 36px; width: auto; max-width: 140px; object-fit: contain; }
  .brand-name { font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
  .mark { width: 48px; height: 38px; flex: none; }
  .mark .wick { stroke: var(--ink-3); stroke-width: 1.6; stroke-linecap: round; }
  .mark .body { fill: var(--ink-3); }
  .mark .up .wick { stroke: var(--ok); }
  .mark .up .body { fill: var(--ok); }
  .mark .c { transform-box: fill-box; transform-origin: 50% 100%; animation: grow .6s cubic-bezier(.2,.7,.2,1) both; }
  .mark .c:nth-child(2) { animation-delay: .08s; }
  .mark .c:nth-child(3) { animation-delay: .16s; }
  .mark .c:nth-child(4) { animation-delay: .24s; }
  @keyframes grow { from { transform: scaleY(0); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }

  h1 { font-size: 28px; font-weight: 800; line-height: 1.15; letter-spacing: -0.025em; }
  .subtitle { color: var(--ink-2); margin: 6px 0 22px; }

  /* progress */
  .steps { display: flex; gap: 8px; list-style: none; margin-bottom: 26px; }
  .steps li { flex: 1; font-size: 12px; font-weight: 600; color: var(--ink-3); }
  .steps li::before { content: ''; display: block; height: 4px; border-radius: 4px; background: var(--line); margin-bottom: 8px; transition: background .25s; }
  .steps li.on { color: var(--ink); }
  .steps li.on::before { background: var(--ink); }
  .steps li.done { color: var(--ink-2); }
  .steps li.done::before { background: var(--ink-2); }
  .steps li.final.on::before { background: var(--ok); }

  /* form */
  .field { margin-bottom: 18px; }
  .label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; }
  .input {
    width: 100%; background: var(--field); color: var(--ink);
    border: 1px solid var(--line-strong); border-radius: var(--radius);
    padding: 14px 16px; font: inherit; font-size: 16px; font-weight: 500;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .input::placeholder { color: var(--ink-3); font-weight: 400; }
  .input:focus { border-color: var(--ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 14%, transparent); }
  .input.err { border-color: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 16%, transparent); }
  #oid { text-transform: uppercase; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
  #oid::placeholder { text-transform: none; letter-spacing: 0; }
  .hint { color: var(--ink-2); font-size: 13px; margin-top: 8px; }
  .err-msg { display: none; color: var(--bad); font-size: 13px; font-weight: 600; margin-top: 8px; }
  .err-msg.show { display: block; }

  .btn {
    display: block; width: 100%; padding: 15px 18px; margin-top: 4px;
    background: var(--btn); color: var(--btn-ink);
    border: 1px solid transparent; border-radius: var(--radius);
    font: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
    transition: background .15s, transform .1s;
  }
  .btn:hover { background: var(--btn-hover); }
  .btn:active { transform: scale(.99); }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-strong); font-weight: 600; margin-top: 10px; }
  .btn.ghost:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
  .btn:focus-visible, a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .input:focus-visible { outline: none; }

  /* messages */
  .note { display: flex; gap: 14px; align-items: flex-start; padding: 16px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--field); margin-bottom: 18px; }
  .note-icon { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--tone) 14%, transparent); color: var(--tone); }
  .note-icon svg { width: 18px; height: 18px; }
  .note-body { min-width: 0; font-size: 14px; color: var(--ink-2); }
  .note-title { display: block; color: var(--ink); font-size: 15px; font-weight: 700; margin-bottom: 2px; }
  .note-body strong { color: var(--ink); font-weight: 700; }
  .note-body a { color: var(--ink); font-weight: 700; text-decoration: underline; text-underline-offset: 2px; }
  .note.success { --tone: var(--ok); }
  .note.fail    { --tone: var(--bad); }
  .note.warning { --tone: var(--info); }
  .note.waiting { --tone: var(--warn); }

  .inline-info { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; font-size: 13px; color: var(--ink-2); }
  .inline-info svg { flex: none; width: 16px; height: 16px; margin-top: 2px; color: var(--warn); }
  .inline-info strong { color: var(--ink); }

  .countdown { text-align: center; padding: 6px 0 22px; }
  .countdown-time { font-size: 52px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .countdown-sub { font-size: 13px; color: var(--ink-2); margin-top: 4px; }

  .confirm { border: 1px solid var(--line-strong); background: var(--field); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; font-size: 14px; color: var(--ink-2); }
  .confirm-email { display: block; font-size: 17px; font-weight: 700; color: var(--ink); margin-bottom: 6px; word-break: break-all; }
  .confirm strong { color: var(--bad); }

  .loading { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 30px 0 14px; }
  .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--ink); animation: spin .8s linear infinite; margin-bottom: 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-title { font-size: 16px; font-weight: 700; }
  .loading-sub { font-size: 13px; color: var(--ink-2); margin-top: 4px; }

  .footer { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); text-align: center; font-size: 13px; color: var(--ink-2); }
  .footer a { color: var(--ink); font-weight: 700; text-decoration: underline; text-underline-offset: 2px; }

  @media (max-width: 420px) {
    .card { padding: 28px 20px 22px; border-radius: 18px; }
    h1 { font-size: 25px; }
    .countdown-time { font-size: 46px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .mark .c { animation: none; }
    .spinner { animation-duration: 2.4s; }
    .btn, .input, .steps li::before { transition: none; }
  }
</style>
</head>
<body>
<main class="card">
  <div class="brand">
    <svg class="mark" id="shopMark" viewBox="0 0 40 32" aria-hidden="true">
      <g class="c"><line class="wick" x1="5" y1="8" x2="5" y2="26"/><rect class="body" x="2.5" y="12" width="5" height="10" rx="1.2"/></g>
      <g class="c"><line class="wick" x1="14" y1="12" x2="14" y2="29"/><rect class="body" x="11.5" y="16" width="5" height="10" rx="1.2"/></g>
      <g class="c"><line class="wick" x1="23" y1="5" x2="23" y2="24"/><rect class="body" x="20.5" y="9" width="5" height="10" rx="1.2"/></g>
      <g class="c up"><line class="wick" x1="32" y1="1" x2="32" y2="20"/><rect class="body" x="29.5" y="4" width="5" height="11" rx="1.2"/></g>
    </svg>
    <img id="shopLogo" src="" alt="" style="display:none" />
    <div class="brand-name" id="shopName"></div>
  </div>

  <h1>Claim your order</h1>
  <p class="subtitle" id="subtitle">Enter your Shopee order ID to get started.</p>

  <ol class="steps" id="steps" aria-label="Progress">
    <li data-s="1">Order ID</li>
    <li data-s="2">Email</li>
    <li data-s="3" class="final">Done</li>
  </ol>

  <div id="app" aria-live="polite"></div>

  <div class="footer">
    Need help? <a id="csLink" href="#" target="_blank" rel="noopener">Message us on Shopee chat</a>.
  </div>
</main>

<script>
// ═══════════════════════════════════════════════════════════
//  ① INSERT YOUR OWN VALUES HERE (edit only these 4 lines)
// ═══════════════════════════════════════════════════════════
const CONFIG = {
  // INSERT YOUR APPS SCRIPT WEB APP URL HERE (the long link ending in /exec).
  // You get it in Apps Script: Deploy > New deployment > Web app > copy "Web app URL".
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbwnalWLNqvvERkX9jDxi_5Uoh-Odabpfz21-Ri_vbJyisr_MdMpYRW2Q7wi7GjT5qaFHA/exec",

  // INSERT YOUR SHOP NAME HERE (shown at the top of the page)
  SHOP_NAME: "TradeTT",

  // INSERT YOUR SHOPEE SHOP LINK HERE (used for the "customer service" and "5-star rating" links)
  // Example: "https://shopee.com.my/yourshopname"
  SHOPEE_SHOP_URL: "https://shopee.com.my/tradett",

  // INSERT YOUR LOGO FILE NAME HERE. Upload the logo next to this file (e.g. logo.png).
  // Leave as "" to show the built-in candlestick mark instead.
  LOGO_URL: ""
};
// ═══════════════════════════════════════════════════════════

const SCRIPT_URL = CONFIG.SCRIPT_URL;
const SETUP_DONE = !/INSERT/i.test(CONFIG.SCRIPT_URL);
const SHOP = CONFIG.SHOPEE_SHOP_URL;
const CS = `Message our <a href="${SHOP}" target="_blank" rel="noopener">customer service</a> on Shopee chat and we will help you right away.`;

function esc(t) { return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// fill in branding from CONFIG
const NAME_SET = !/INSERT/i.test(CONFIG.SHOP_NAME);
document.getElementById('shopName').textContent = NAME_SET ? CONFIG.SHOP_NAME : '';
document.title = (NAME_SET ? CONFIG.SHOP_NAME + ' - ' : '') + 'Claim Your Order';
if (CONFIG.LOGO_URL) {
  const lg = document.getElementById('shopLogo');
  lg.src = CONFIG.LOGO_URL; lg.alt = CONFIG.SHOP_NAME; lg.style.display = '';
  document.getElementById('shopMark').style.display = 'none';
  if (NAME_SET) document.getElementById('shopName').style.display = 'none'; // the logo already says the name
}
document.getElementById('csLink').href = SHOP;

let ORDER_ID = '';
let EMAIL = '';
let cdTimer = null;
let cbCounter = 0;

// ── icons (simple line icons) ──
const SVG = (p) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICON = {
  success: SVG('<path d="M20 6 9 17l-5-5"/>'),
  fail:    SVG('<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/>'),
  warning: SVG('<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.01"/>'),
  waiting: SVG('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  mail:    SVG('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>'),
  cancel:  SVG('<circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/>'),
  alert:   SVG('<path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 10v4.5M12 17.5v.01"/>')
};
function note(type, title, body, icon) {
  return `<div class="note ${type}"><span class="note-icon">${ICON[icon || type]}</span><div class="note-body"><strong class="note-title">${title}</strong>${body}</div></div>`;
}

const ERRORS = {
  not_found:     { t:'fail',    i:'fail',    h:'Order ID not found',    m:`We could not find this order ID. Check it and try again.<br><br>${CS}` },
  already_sent:  { t:'warning', i:'mail',    h:'Already delivered',     m:`This order has already been sent. Check your inbox and spam folder.<br><br>Still cannot find it? ${CS}` },
  cancelled:     { t:'fail',    i:'cancel',  h:'Order cancelled',       m:`This order was cancelled, so it cannot be claimed.<br><br>If you think this is a mistake, ${CS}` },
  book_not_found:{ t:'fail',    i:'alert',   h:'We could not process your order', m:`Something went wrong on our side. ${CS}` },
  file_too_large:{ t:'fail',    i:'alert',   h:'We could not process your order', m:`Something went wrong on our side. ${CS}` },
  send_failed:   { t:'fail',    i:'alert',   h:'We could not send your order',    m:`The email did not go through. ${CS}` },
  server_error:  { t:'fail',    i:'alert',   h:'Something went wrong',  m:`An unexpected error occurred. ${CS}` },
  need_google_email:{ t:'warning', i:'mail', h:'Enter a Gmail address', m:`Your video course is shared privately with a <strong>Google account</strong>. Enter your <strong>Gmail address</strong> (ending in @gmail.com) to receive access.` },
  _timeout:      { t:'fail',    i:'waiting', h:'Request timed out',     m:`Please try again. ${CS}` },
  _default:      { t:'fail',    i:'alert',   h:'Something went wrong',  m:`An unexpected error occurred. ${CS}` },
};
function errNote(key) { const e = ERRORS[key] || ERRORS._default; return note(e.t, e.h, e.m, e.i); }

// step: 1 = order ID, 2 = email, 3 = done (optional; leaves the progress bar alone when omitted)
const SUBS = {
  1: 'Enter your Shopee order ID to get started.',
  2: 'Tell us where to send your order.',
  3: 'You are all set.'
};
function setStep(n, sub) {
  document.querySelectorAll('#steps li').forEach(li => {
    const s = +li.dataset.s;
    li.classList.toggle('on', s === n);
    li.classList.toggle('done', s < n);
  });
  document.getElementById('subtitle').textContent = sub || SUBS[n];
}
function render(html, step, sub) {
  if (cdTimer) { clearInterval(cdTimer); cdTimer = null; }
  if (step) setStep(step, sub);
  document.getElementById('app').innerHTML = html;
}

function validEmail(e) {
  const p = e.split('@');
  if (p.length !== 2) return false;
  const d = p[1];
  return d.includes('.') && !d.startsWith('.') && !d.endsWith('.') && p[0].length > 0;
}

// Talks to the Apps Script web app. First choice: a normal fetch() request.
// If fetch is blocked or fails, falls back to the older script-tag (JSONP) method.
function api(params, done) {
  const qs = Object.entries(params).map(([k,v]) => k+'='+encodeURIComponent(v)).join('&');
  const url = SCRIPT_URL + '?' + qs;
  let finished = false;
  const finish = r => { if (finished) return; finished = true; clearTimeout(tid); done(r); };
  const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const tid = setTimeout(() => { if (ctrl) ctrl.abort(); finish(null); }, 45000);

  if (typeof fetch !== 'function') { apiJsonp(params, finish); return; }

  fetch(url, { method: 'GET', redirect: 'follow', signal: ctrl ? ctrl.signal : undefined })
    .then(r => r.text())
    .then(t => {
      let j = null;
      try { j = JSON.parse(t); } catch (e) { console.error('[TradeTT] Unexpected reply from server:', String(t).slice(0, 200)); }
      if (j) finish(j); else apiJsonp(params, finish);
    })
    .catch(err => {
      console.warn('[TradeTT] fetch failed, trying fallback method:', err);
      if (!finished) apiJsonp(params, finish);
    });
}

// Older method (script tag). Kept as a fallback.
function apiJsonp(params, done) {
  const name = '__lz' + (++cbCounter) + '_' + Date.now();
  const qs = Object.entries(params).map(([k,v]) => k+'='+encodeURIComponent(v)).join('&');
  const sid = 'lzs_' + cbCounter;
  const cleanup = () => { delete window[name]; const s = document.getElementById(sid); if (s) s.remove(); };
  const jt = setTimeout(() => { cleanup(); console.error('[TradeTT] No reply from server (fallback method timed out)'); done(null); }, 30000);
  window[name] = r => { clearTimeout(jt); cleanup(); done(r); };
  const sc = document.createElement('script');
  sc.id = sid;
  sc.onerror = () => console.error('[TradeTT] The browser could not load the server reply (blocked?)');
  sc.src = SCRIPT_URL + '?' + qs + '&callback=' + name;
  document.body.appendChild(sc);
}

function backBtn() {
  return `<button class="btn ghost" onclick="stepOrderId()">Check another order</button>`;
}

// ════ STEP 1: Order ID ════
function stepOrderId(errorKey) {
  if (!SETUP_DONE) {
    render(note('fail', 'Setup not finished', 'Open <strong>index.html</strong>, find <strong>CONFIG</strong> near the bottom, and replace every <strong>INSERT...</strong> value. See README.md.', 'alert'), 1);
    return;
  }
  render(`
    ${errorKey ? errNote(errorKey) : ''}
    <div class="field">
      <label class="label" for="oid">Shopee order ID</label>
      <input class="input" id="oid" placeholder="e.g. 260529N1Q25U6C" autocomplete="off" autocapitalize="characters" spellcheck="false" />
      <div class="err-msg" id="oidErr">Enter your order ID.</div>
    </div>
    <button class="btn" onclick="submitOrderId()">Check my order</button>
  `, 1);
  const inp = document.getElementById('oid');
  if (inp) { inp.focus(); inp.addEventListener('keydown', e => { if(e.key==='Enter') submitOrderId(); }); }
}

function submitOrderId() {
  const v = (document.getElementById('oid').value || '').trim().toUpperCase();
  if (!v) {
    document.getElementById('oid').classList.add('err');
    document.getElementById('oidErr').classList.add('show');
    return;
  }
  ORDER_ID = v;

  render(`
    <div class="loading">
      <div class="spinner"></div>
      <div class="loading-title">Checking your order</div>
      <div class="loading-sub">This only takes a moment.</div>
    </div>
  `, 1, 'One moment.');

  api({ orderId: ORDER_ID, checkOnly: 'true' }, r => {
    if (!r) { stepOrderId('_timeout'); return; }
    if (r.error === 'not_ready') { stepCountdown(r.secondsLeft, r.bookCount, r.readyAt); }
    else if (r.error === 'ready') { stepEmail(!!r.gmailOnly); }
    else if (r.error === 'cancelled') { stepCancelled(); }
    else if (r.error === 'already_sent') { stepAlreadySent(); }
    else if (r.error === 'not_found') { stepNotFound(); }
    else { stepOrderId(r.error || '_default'); }
  });
}

// ════ STEP 2a: Countdown ════
function stepCountdown(secsLeft, bookCount, readyAtMs) {
  const readyAt = new Date(readyAtMs);
  const readyAtStr = readyAt.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });

  render(`
    ${note('waiting', 'Almost ready', `We are checking your order of <strong>${bookCount} item${bookCount === 1 ? '' : 's'}</strong> to make sure you receive everything. You can claim it at <strong>${readyAtStr}</strong>.`)}
    <div class="countdown">
      <div class="countdown-time" id="cdTimer">--:--</div>
      <div class="countdown-sub">Ready at ${readyAtStr}</div>
    </div>
    ${backBtn()}
  `, 1, 'We are still checking your order.');

  function tick() {
    const diff = Math.max(0, Math.ceil((readyAt - Date.now()) / 1000));
    const el = document.getElementById('cdTimer');
    if (el) el.textContent = String(Math.floor(diff/60)).padStart(2,'0') + ':' + String(diff%60).padStart(2,'0');
    if (diff <= 0) { clearInterval(cdTimer); cdTimer = null; stepEmail(); }
  }
  tick();
  cdTimer = setInterval(tick, 1000);
}

// ════ STEP 2b: Not Found ════
function stepNotFound() {
  render(`${errNote('not_found')}${backBtn()}`, 1);
}

// ════ STEP 2b: Already Sent ════
function stepAlreadySent() {
  render(`${errNote('already_sent')}${backBtn()}`, 1);
}

// ════ STEP 2b: Cancelled ════
function stepCancelled() {
  render(`${errNote('cancelled')}${backBtn()}`, 1);
}

// ════ STEP 2c: Ready + Email ════
function stepEmail(gmailOnly) {
  render(`
    ${note('success', 'Order verified', 'Enter your email to receive your course access or ebook.')}
    <div class="field">
      <label class="label" for="eml">Your email address</label>
      <input class="input" id="eml" type="email" inputmode="email" placeholder="you@example.com" autocomplete="off" autocapitalize="off" spellcheck="false" />
      <div class="err-msg" id="emlErr">Enter a valid email, for example you@gmail.com.</div>
      <div class="inline-info">${ICON.alert}<span>${gmailOnly
        ? 'Your video course is shared privately with a Google account. Use your <strong>Gmail address</strong> (@gmail.com), not a student email.'
        : 'Use a regular email (Gmail, Yahoo, Outlook and so on), <strong>not a student email</strong>. Student emails often block links and attachments.'}</span></div>
    </div>
    <button class="btn" onclick="submitEmail()">Continue</button>
  `, 2);
  const inp = document.getElementById('eml');
  if (inp) { inp.focus(); inp.addEventListener('keydown', e => { if(e.key==='Enter') submitEmail(); }); }
}

function submitEmail() {
  const v = (document.getElementById('eml').value || '').trim();
  if (!v || !validEmail(v)) {
    document.getElementById('eml').classList.add('err');
    document.getElementById('emlErr').classList.add('show');
    return;
  }
  EMAIL = v;
  stepConfirm();
}

// ════ STEP 3: Confirm ════
function stepConfirm() {
  render(`
    <div class="confirm">
      <span class="confirm-email">${esc(EMAIL)}</span>
      Check that this address is correct. Your order is sent here once and <strong>cannot be resent</strong> to a different address.
    </div>
    <button class="btn" onclick="submitSend()">Send my order</button>
    <button class="btn ghost" onclick="stepEmail()">Change email</button>
  `, 2);
}

// ════ STEP 4: Send ════
function submitSend() {
  render(`
    <div class="loading">
      <div class="spinner"></div>
      <div class="loading-title">Sending your order</div>
      <div class="loading-sub">This can take up to 15 seconds. Please keep this page open.</div>
    </div>
  `, 2, 'Almost there.');

  api({ orderId: ORDER_ID, email: EMAIL }, r => {
    if (!r) {
      render(`${errNote('_timeout')}${backBtn()}`, 2, 'Your order has not been sent yet.');
      return;
    }
    if (r.success) {
      render(`
        ${note('success', 'Order sent', `Your order is on its way to <strong>${esc(EMAIL)}</strong>. It should arrive within a few minutes. If you do not see it, check your <strong>spam or junk folder</strong>.`)}
        <p class="hint" style="margin:0 0 16px">Enjoying your purchase? A <a href="${SHOP}" target="_blank" rel="noopener" style="color:var(--ink);font-weight:700">5-star rating on Shopee</a> takes five seconds and helps us reach more learners.</p>
        ${backBtn()}
      `, 3);
    } else if (r.error === 'cancelled') {
      stepCancelled();
    } else if (r.error === 'need_google_email') {
      render(`${errNote('need_google_email')}<button class="btn" onclick="stepEmail(true)">Enter a Gmail address</button>`, 2);
    } else {
      render(`${errNote(r.error)}${backBtn()}`, 2, 'Your order has not been sent.');
    }
  });
}

// Start
stepOrderId();
</script>
</body>
</html>
